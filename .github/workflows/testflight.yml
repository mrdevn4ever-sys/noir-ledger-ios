name: TestFlight

# Signs a Release build with the distribution identity from GitHub secrets and uploads it to App Store Connect.
# Started by pushing a tag "testflight-*" (works from any branch) or by hand once this file is on the default branch.
# Set-up of the Apple side and of the secrets: docs/TESTFLIGHT.md.
on:
  push:
    tags:
      - "testflight-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload:
    name: Archive, sign and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # The runner context is not available in job-level env, so the keychain path is set here.
      - name: Prepare paths
        run: echo "KEYCHAIN=$RUNNER_TEMP/noir-signing.keychain-db" >> "$GITHUB_ENV"

      # App Store Connect only accepts builds made with the iOS 26 SDK or later (Xcode 26+).
      - name: Select Xcode 26 or newer
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 or newer on this runner image; the upload would be rejected."
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Check that every secret is set
        env:
          S1: ${{ secrets.ASC_KEY_ID }}
          S2: ${{ secrets.ASC_ISSUER_ID }}
          S3: ${{ secrets.ASC_KEY_P8_BASE64 }}
          S4: ${{ secrets.APPLE_TEAM_ID }}
          S5: ${{ secrets.DIST_CERT_P12_BASE64 }}
          S6: ${{ secrets.DIST_CERT_PASSWORD }}
          S7: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          missing=0
          for pair in "ASC_KEY_ID:$S1" "ASC_ISSUER_ID:$S2" "ASC_KEY_P8_BASE64:$S3" "APPLE_TEAM_ID:$S4" \
                      "DIST_CERT_P12_BASE64:$S5" "DIST_CERT_PASSWORD:$S6" "APPSTORE_PROFILE_BASE64:$S7"; do
            if [ -z "${pair#*:}" ]; then echo "missing secret: ${pair%%:*}"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "Set the missing secrets (docs/TESTFLIGHT.md) and push a new tag."; exit 1; }
          xcodebuild -version

      - name: Install the distribution certificate in a temporary keychain
        env:
          CERT_B64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install the App Store provisioning profile
        env:
          PROFILE_B64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/noir.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/noir.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/noir.mobileprovision" "$dir/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "profile: $NAME ($UUID)"

      - name: Install the App Store Connect API key
        env:
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (Release, distribution signing)
        run: |
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "build number $BUILD_NUMBER"
          set -o pipefail
          xcodebuild archive \
            -project NoirLedger.xcodeproj -scheme NoirLedger -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NoirLedger.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            NOIR_TEAM="$TEAM_ID" NOIR_PROFILE="$PROFILE_NAME" NOIR_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*(sign|profile)|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/NoirLedger.xcarchive" || { tail -n 200 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.puredevn.noirledger</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NoirLedger.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          echo "Uploaded build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}. App Store Connect processes it for 10-30 minutes before it appears in TestFlight."

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/noir.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
