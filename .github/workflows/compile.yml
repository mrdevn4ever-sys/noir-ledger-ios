name: Quick compile

# Core tests and a simulator build. Manual runs can exercise the short opening and persistence suite too.
on:
  workflow_dispatch:
    inputs:
      opening:
        description: "Run app tests and time each unaccelerated opening on the simulator"
        type: boolean
        default: false
      frame_diagnostic:
        description: "Profile the pinned failed frame comparison (not a release gate)"
        type: boolean
        default: false
  push:
    branches: ["claude/**"]

permissions:
  contents: read

jobs:
  compile:
    name: Core tests and app build
    runs-on: macos-26
    timeout-minutes: 40
    # On a push only when the commit asks for it with [compile].
    if: ${{ !inputs.frame_diagnostic && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compile]')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode (27 when available)
        run: |
          set -e
          pick=$(ls -d /Applications/Xcode_2[7-9]*.app /Applications/Xcode_3[0-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$pick" ]; then
            pick=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          [ -n "$pick" ] || { echo "no Xcode found"; exit 1; }
          sudo xcode-select -s "$pick/Contents/Developer"
          xcodebuild -version
      - name: Core tests
        run: cd Packages/NoirCore && swift test 2>&1 | tee ../../core-tests.log | grep -E "error:|✘|pacing|Test run" || true
      - name: Core result
        run: grep -q "Test run with .* passed" core-tests.log
      - name: Read and resave files produced by the previous release
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin 1d695653c3929c236c74b9d6bd192593d338ef52
          python3 scripts/ci/save-compat/save_compat.py
      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build the app and the tests for the simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project NoirLedger.xcodeproj -scheme NoirLedger -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee build.log | grep -E " error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED\|TEST BUILD SUCCEEDED" build.log
      - name: Run app tests and the three openings
        if: github.event_name == 'workflow_dispatch' && inputs.opening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pick_simulator.py > sim.env
          source sim.env
          echo "OPENING_DEVICE $SIM_NAME $SIM_RUNTIME source=$GITHUB_SHA"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild test-without-building -project NoirLedger.xcodeproj -scheme NoirLedger \
            -configuration Debug -destination "id=$SIM_UDID" -derivedDataPath build \
            -parallel-testing-enabled NO -resultBundlePath build/Opening.xcresult \
            -only-testing:NoirLedgerTests -only-testing:NoirLedgerUITests/OpeningTimingUITests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee opening.log | grep -E 'Test Case|Test Suite|OPENING |error:|✘|✔|\*\* TEST'
      - name: Preserve the focused test evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.opening
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path build/Opening.xcresult --compact > opening-summary.json
          xcrun xcresulttool get test-results tests --path build/Opening.xcresult --compact > opening-tests.json
          python3 -m json.tool opening-summary.json
          python3 scripts/ci/opening_report.py opening.log opening-summary.json opening-tests.json
      - name: Upload the focused test result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.opening
        uses: actions/upload-artifact@v4
        with:
          name: opening-${{ github.sha }}
          path: |
            opening.log
            opening-summary.json
            opening-tests.json
            build/Opening.xcresult
          retention-days: 7
      - name: Errors
        if: failure()
        run: grep -E " error:" build.log core-tests.log | sort -u | head -80 || true

  diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.frame_diagnostic && !inputs.opening && github.ref == 'refs/heads/rebuild/varnholm' && github.repository == 'mrdevn4ever-sys/noir-ledger-ios' }}
    permissions:
      contents: read
      actions: read
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Read diagnostic package at dispatch SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: scripts/qa/m1-diagnostic
          persist-credentials: false
      - name: Read candidate and pinned ancestor (never build in this checkout)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4900655f78735cfc7ce352dc912850f2a5c00cc1
          fetch-depth: 32
          path: pinned-game
          persist-credentials: false
      - name: Verify unprofiled gate first, then collect paired simulator CPU samples
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          M1_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)
          export DEVELOPER_DIR="$XCODE/Contents/Developer"
          python3 -B scripts/qa/m1-diagnostic/runner.py --confirm M1_GATE_FAILED --attempt 1
      - name: Preserve partial or complete evidence, including trace bundle layout
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/m1-trace/evidence" ]]; then
            tar -C "$RUNNER_TEMP/m1-trace" -czf "$RUNNER_TEMP/m1-evidence.tgz" evidence
          fi
      - name: Diagnostic evidence only
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m1-evidence.tgz
          retention-days: 3
          if-no-files-found: warn
