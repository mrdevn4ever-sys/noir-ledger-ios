# XcodeGen specification — the single source of truth for NoirLedger.xcodeproj (generated in CI, not committed).
# Generate with: xcodegen generate
name: NoirLedger
options:
  bundleIdPrefix: io.puredevn
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  NoirCore:
    path: Packages/NoirCore
  # Rewarded videos (App/Monetization/AdMobProvider.swift). The provider compiles only while this package is present:
  # removing these two entries and the two dependencies below builds the game without any advertising SDK.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 11.2.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    majorVersion: 2.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
targets:
  NoirLedger:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: NoirCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.puredevn.noirledger
        OTHER_LDFLAGS: $(inherited) -ObjC
        PRODUCT_NAME: NoirLedger
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG NOIR_QA
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          SWIFT_OPTIMIZATION_LEVEL: -O
  NoirLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: NoirLedger
      - package: NoirCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.puredevn.noirledger.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NoirLedger.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NoirLedger
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG NOIR_QA
  NoirLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: NoirLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.puredevn.noirledger.uitests
        GENERATE_INFOPLIST_FILE: YES
        # XCTest UI tests drive main-actor XCUI APIs from synchronous test methods; Swift 5 mode keeps them simple.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_TARGET_NAME: NoirLedger
schemes:
  NoirLedger:
    build:
      targets:
        NoirLedger: all
        NoirLedgerTests: [test]
        NoirLedgerUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Products.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: NoirLedgerTests
        - name: NoirLedgerUITests
    archive:
      config: Release
